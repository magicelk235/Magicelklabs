<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Tab-bar variant of the house mark. Containerless, so the fill follows the
       browser chrome instead: near-black on a light tab bar, ivory on a dark one.
       Do NOT use this one inside a page; an <img> resolves the media query against
       the OS setting, not the page, so on a light-mode Mac it would render
       near-black on our dark nav pill and disappear. Use mark.svg there. -->
  <style>
    path { fill: #131315 }
    @media (prefers-color-scheme: dark) { path { fill: #F5F5F4 } }
  </style>
